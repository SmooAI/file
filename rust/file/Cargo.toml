[package]
name = "smooai-file"
version = "2.2.21"
edition = "2021"
description = "A unified file handling library for working with files from local filesystem, S3, URLs, and streams."
license = "MIT"
repository = "https://github.com/SmooAI/file"
homepage = "https://github.com/SmooAI/file"
keywords = ["file", "s3", "streaming", "smooai"]
categories = ["filesystem"]
readme = "README.md"

[features]
# `file` = the I/O `File` type (local, URL, stream and S3 sources). On by default.
# `default-features = false` leaves `detection`, `content_disposition` and the
# validation error types, with no AWS SDK, reqwest or tokio — for services that
# only need to sniff bytes they already hold.
default = ["file"]
file = [
    "dep:reqwest",
    "dep:bytes",
    "dep:tokio",
    "dep:tokio-util",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:hex",
    "dep:base64",
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:chrono",
    "dep:futures",
    "dep:tracing",
    "dep:url",
    "dep:tempfile",
]

[dependencies]
infer = "0.19"
mime_guess = "2"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "stream", "multipart"], optional = true }
bytes = { version = "1", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
futures = { version = "0.3", optional = true }
tracing = { version = "0.1", optional = true }
url = { version = "2", optional = true }
tempfile = { version = "3", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }
wiremock = "0.6"
memory-stats = "1"
