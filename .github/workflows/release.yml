name: Release (Changesets 🦋)

on:
    workflow_dispatch:
    push:
        branches:
            - main

env:
    CI: true
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
    version:
        timeout-minutes: 30
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            id-token: write
            actions: write
        steps:
            - name: Checkout code repository
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GH_PAT }}

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: 'pnpm'

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: '3.13'

            - name: Setup uv
              uses: astral-sh/setup-uv@v6

            - name: Setup Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Rust build artifacts
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: |
                      rust/file -> rust/file/target
                  cache-on-failure: true

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: '1.23'
                  cache-dependency-path: go/file/go.sum

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: |
                      8.0.x
                      9.0.x
                      10.0.x

            - name: Install dependencies
              run: pnpm install

            - name: Sync Python dependencies
              run: uv sync --group dev
              working-directory: python

            - name: Version drift check
              run: pnpm version:check

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            # CHECK, never write. `pnpm format` here would rewrite files that then
            # either get swept into the release commit unreviewed, or — in publish
            # mode, where the changesets action commits nothing — leave the tree
            # dirty when `cargo publish --locked` runs, failing every release.
            # The formatting the release itself needs (changesets writes a
            # CHANGELOG.md that oxfmt rewrites) happens inside `pnpm run version`,
            # before the action commits.
            - name: Format check
              run: pnpm format:check

            - name: Version Update 🦋
              id: changesets
              uses: changesets/action@v1
              with:
                  commit: '🦋 New version release'
                  title: '🦋 New version release'
                  # `pnpm run version` = `changeset version && sync-versions`. The action
                  # commits the working tree after this runs, so the synced manifests land
                  # in the release commit instead of being thrown away in a CI workspace.
                  version: pnpm run version
                  publish: pnpm ci:publish
                  createGithubReleases: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GH_PAT }}
                  NPM_TOKEN: ${{ secrets.SMOOAI_NPM_TOKEN }}

            # Which registries still lack package.json's version. Gating each publish
            # on its OWN registry, rather than on npm having published in THIS run,
            # is what makes a retry ship exactly what is missing. The old gate
            # (`steps.changesets.outputs.published == 'true'`) meant a run where npm
            # succeeded and a later step failed could never be retried: the retry
            # found nothing new for npm, so all four remaining steps skipped and the
            # run went GREEN having published nothing.
            - name: Check registries
              id: registries
              # --expect-npm when changesets just published, so the npm index has a
              # moment to catch up; reading "missing" during that window would skip
              # the very publish this run earned and then report success.
              run: node scripts/check-registries.mjs --github ${{ steps.changesets.outputs.published == 'true' && '--expect-npm' || '' }}

            - name: Publish smooai-file to PyPI
              if: steps.registries.outputs.pypi_missing == 'true'
              working-directory: python
              env:
                  UV_PUBLISH_TOKEN: ${{ secrets.SMOOAI_PYPI_TOKEN }}
              run: |
                  # Clean artifacts from the earlier `pnpm build` step so `uv publish`
                  # uploads only what it just built. (The version they carry is no
                  # longer stale — sync-versions runs in the `version` lifecycle now —
                  # but a leftover wheel from a previous version still would be.)
                  rm -rf dist/
                  uv run poe publish

            - name: Publish smooai-file to crates.io
              if: steps.registries.outputs.crates_missing == 'true'
              # No --allow-dirty: sync-versions.mjs now runs in the `version` lifecycle,
              # so Cargo.toml and Cargo.lock are already committed at the synced version
              # and the tree is clean here. --locked keeps the publish build reproducible.
              run: cargo publish --locked --manifest-path rust/file/Cargo.toml
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.SMOOAI_CARGO_REGISTRY_TOKEN }}

            - name: Tag and publish Go module
              if: steps.registries.outputs.go_missing == 'true'
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="go/file/v${VERSION}"

                  # Last line of defence before an immutable tag: Go only resolves
                  # go/file/vN.x.y if go.mod's module path carries the matching /vN
                  # suffix (none for majors 0 and 1). Mismatch = a tag that resolves
                  # nothing, forever.
                  MAJOR="${VERSION%%.*}"
                  MODULE=$(awk '/^module /{print $2}' go/file/go.mod)
                  if [ "$MAJOR" -ge 2 ]; then EXPECTED="github.com/SmooAI/file/go/file/v${MAJOR}"; else EXPECTED="github.com/SmooAI/file/go/file"; fi
                  if [ "$MODULE" != "$EXPECTED" ]; then
                    echo "::error::go.mod module is '${MODULE}' but tag ${TAG} needs '${EXPECTED}'"
                    exit 1
                  fi

                  echo "Creating Go module tag: ${TAG}"
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${TAG}"
                  git push origin "${TAG}"
                  echo "Go module tagged and pushed: ${TAG}"

            - name: Build and test .NET
              run: |
                  dotnet restore
                  dotnet build --configuration Release --no-restore
                  dotnet test --configuration Release --no-build --logger "console;verbosity=minimal"
              working-directory: dotnet

            - name: Pack and publish SmooAI.File + SmooAI.File.S3 to NuGet
              if: steps.registries.outputs.nuget_missing == 'true'
              run: |
                  # Version is sourced from csproj <Version>, which sync-versions.mjs
                  # kept in lockstep with package.json before changeset publish ran.
                  VERSION=$(node -p "require('./package.json').version")
                  echo "Packing .NET version ${VERSION} (from csproj)"
                  dotnet pack dotnet/src/SmooAI.File/SmooAI.File.csproj \
                      --configuration Release \
                      -o dotnet/artifacts
                  dotnet pack dotnet/src/SmooAI.File.S3/SmooAI.File.S3.csproj \
                      --configuration Release \
                      -o dotnet/artifacts

                  for pkg in dotnet/artifacts/*.nupkg; do
                      echo "Pushing $pkg to NuGet..."
                      dotnet nuget push "$pkg" \
                          --api-key "${NUGET_API_KEY}" \
                          --source https://api.nuget.org/v3/index.json \
                          --skip-duplicate
                  done
              env:
                  NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

            # Fails the run if npm published this version and PyPI, crates.io or the
            # Go tag did not. Without it a partial publish is indistinguishable from
            # a version-PR run — both are green — and those ports quietly keep
            # shipping the previous release. NuGet is reported but not asserted: its
            # index lags an accepted push by minutes to tens of minutes, so holding
            # it strictly would redden every successful release. See
            # scripts/check-registries.mjs.
            - name: Verify no registry was stranded
              run: node scripts/check-registries.mjs --assert

            - name: Auto-Merge Changeset PR
              run: |
                  PR_NUMBER=$(gh pr list --state open --head changeset-release/main --json number --jq '.[0].number')

                  if [[ -n "$PR_NUMBER" && "$PR_NUMBER" != "null" ]]; then
                    echo "Found Changeset PR #$PR_NUMBER, attempting to auto-merge..."
                    gh pr merge "$PR_NUMBER" --auto --squash
                    
                    # Re-trigger the Release workflow
                    echo "Re-triggering the release workflow..."
                    gh workflow run release.yml
                  else
                    echo "No open Changeset PR found, skipping merge."
                  fi
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}
